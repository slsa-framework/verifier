---
track: source
id: source-control-scs-protected-refs
title: Source Provenance Declares SLSA_SOURCE_SCS_PROTECTED_REFS
description: |
  Asserts the source provenance lists the SLSA_SOURCE_SCS_PROTECTED_REFS
  control (or its deprecated alias TAG_HYGIENE) as active before the
  provenance was issued. Required for SLSA
  Source L3 — the source control system enforces the configured
  protection rules on protected refs.
checks:
  - predicateType: https://github.com/slsa-framework/slsa-source-poc/source-provenance/v1-draft
    expression: >-
      predicate.controls.exists(c, c.name in ["SLSA_SOURCE_SCS_PROTECTED_REFS", "TAG_HYGIENE"]
      && has(c.since) && c.since <= predicate.createdOn
      && (!('enforced_since' in params) || c.since <= timestamp(string(params.enforced_since))))
  - predicateType: https://github.com/slsa-framework/source-tool/source-provenance/v1
    expression: >-
      predicate.controls.exists(c, c.name in ["SLSA_SOURCE_SCS_PROTECTED_REFS", "TAG_HYGIENE"]
      && has(c.since) && c.since <= predicate.createdOn
      && (!('enforced_since' in params) || c.since <= timestamp(string(params.enforced_since))))
